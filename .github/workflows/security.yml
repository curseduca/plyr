name: Security

# Varredura de segurança pela stack compartilhada, pinada em TAG
# (curseduca/waid-cicd-stack@v1).
#
# Este arquivo é IDÊNTICO em toda a org, de propósito: os três workflows que ele
# chama não têm nenhuma referência a pnpm, `package.json` ou `setup-node`, então
# rodam em qualquer repositório, em qualquer linguagem — Node, Terraform, PHP,
# Python, shell ou repositório só de docs. Não exige script novo, dependência
# nova nem teste escrito.
#
# Por que existe: a cobertura de secret scanning e SAST na org era de 12
# repositórios em 133. Este caller é a Onda 0 do PLANO-ADOCAO-STACK-FROTA.md —
# a ação de maior relação cobertura/esforço do programa de CI/CD.
#
# Os três jobs entram **advisory**: rodam, publicam relatório no resumo da run e
# não reprovam PR. A razão está medida na seção abaixo — não é preferência, é o
# que o lote piloto mostrou. Sair do advisory é trabalho na stack, não aqui.
#
# Os três jobs NÃO recebem secret nenhum, de propósito: não instalam
# dependência, e `secrets: inherit` num job que não precisa é exatamente a regra
# `yaml.github-actions.security.secrets-inherit` que o próprio Semgrep aplica —
# o caller reprovaria a si mesmo.
#
# `secret-scan` roda no escopo dos commits da PR (`full-history: false`, o
# default). A varredura do histórico completo é uma operação de adoção separada:
# pode achar credencial antiga, e credencial encontrada precisa ser
# **rotacionada**, não só removida do commit.
#
#
# ## Por que `Secret Scan` e `SAST` entram ADVISORY (medido em 18/08/2026)
#
# A versão anterior deste arquivo tinha os dois bloqueantes, com a justificativa
# de que "dependem só do código". A justificativa está certa e a conclusão
# estava errada: o código da frota já viola os dois, em massa, desde antes de
# qualquer PR. Medição do lote piloto — 9 repositórios, 5 linguagens:
#
#   - `SAST` reprovou em 8 de 9.
#   - `Secret Scan` reprovou em 5 de 9.
#
# E as causas não são achados de segurança de verdade:
#
#   - `github-actions-mutable-action-tag`: o Semgrep reprova `uses: ...@v4` e
#     `@v1` por serem tag móvel. É **exatamente a estratégia de pinagem que esta
#     org escolheu** — a `waid-cicd-stack` é consumida em `@v1` de propósito,
#     com a tag movida por decisão. Satisfazer a regra exigiria pinar toda action
#     em SHA e desmontar esse desenho.
#   - `dependabot-missing-cooldown`, `npm-missing-minimum-release-age`: regras de
#     higiene de supply chain que o Semgrep **publicou depois** do código
#     existir. São scanner de calendário com outra roupa: entram vermelhas sem
#     ninguém ter tocado no repositório.
#   - `generic-api-key` do gitleaks batendo em **`README.md`** — badge de
#     boilerplate do NestJS com `?token=` na URL. Falso positivo, e a stack não
#     tem hoje mecanismo de allowlist (`.gitleaks.toml`) para calar.
#
# Então: os dois rodam, publicam relatório e **não travam PR de ninguém**. Sair
# do advisory depende de trabalho na stack (ruleset curado do Semgrep + allowlist
# do gitleaks), não de trabalho neste repositório.

# Ref: WAID-3224 · PLANO-ADOCAO-STACK-FROTA.md (Onda 0)

on:
    pull_request:
    push:
        branches: [master]

concurrency:
    group: security-${{ github.event_name == 'push' && github.ref || github.head_ref }}
    cancel-in-progress: true

jobs:
    secret-scan:
        name: Secret Scan
        uses: curseduca/waid-cicd-stack/.github/workflows/secret-scan.yml@v1
        with:
            advisory: true

    sast:
        name: SAST
        uses: curseduca/waid-cicd-stack/.github/workflows/sast.yml@v1
        with:
            advisory: true

    deps-scan:
        name: Dependency Scan
        uses: curseduca/waid-cicd-stack/.github/workflows/deps-scan.yml@v1
        with:
            advisory: true
